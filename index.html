<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Зарплата</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Зарплата">
<meta name="theme-color" content="#d6336c">
<style>
:root{--bg:#fbf6f4;--card:#fff;--tx:#2a1f25;--mut:#8a7a82;--ac:#d6336c;--ac2:#ff7aa8;--ok:#3f8a5a;--bad:#c0392b;--ln:#f0e4e8;--sh:0 8px 30px rgba(214,51,108,.10);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16101a;--card:#211826;--tx:#f5eaf0;--mut:#a592a0;--ac:#ff5c93;--ac2:#b8336a;--ok:#6fcf97;--bad:#ff7b6b;--ln:#33263a;--sh:0 8px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16101a;--card:#211826;--tx:#f5eaf0;--mut:#a592a0;--ac:#ff5c93;--ac2:#b8336a;--ok:#6fcf97;--bad:#ff7b6b;--ln:#33263a;--sh:0 8px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:calc(72px + env(safe-area-inset-top,0px)) 16px 40px}
button{font:inherit;cursor:pointer}
.bar{position:fixed;top:0;left:0;right:0;height:calc(56px + env(safe-area-inset-top,0px));display:flex;align-items:flex-end;gap:12px;padding:0 14px 8px;background:var(--bg);opacity:1;backdrop-filter:none;-webkit-backdrop-filter:none;z-index:50;border-bottom:1px solid var(--ln);transform:translateZ(0)}
.bar h1{font-size:18px;margin:0;flex:1}
.burger{height:40px;padding:0 14px;border:0;border-radius:12px;background:var(--card);color:var(--tx);font-size:15px;font-weight:700;box-shadow:var(--sh);white-space:nowrap}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20}
.drawer.on{display:block;animation:fade .2s}
.menu{position:absolute;top:0;left:0;bottom:0;width:260px;background:var(--card);padding:calc(18px + env(safe-area-inset-top,0px)) 14px 18px;box-shadow:var(--sh);transform:translateX(-100%);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.drawer.on .menu{transform:none}
.menu .who{font-size:13px;color:var(--mut);margin:4px 8px 14px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--tx);padding:13px 12px;border-radius:12px;font-size:16px}
.menu button.on{background:var(--ac);color:#fff;font-weight:700}
.menu hr{border:0;border-top:1px solid var(--ln);margin:10px 0}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:26px;padding:22px;box-shadow:var(--sh);animation:rise .5s both}
.big{font-size:40px;font-weight:800;letter-spacing:-1px;margin:4px 0}
.stats{display:flex;gap:16px;font-size:13px;flex-wrap:wrap}.stats b{display:block;font-size:15px}
.mn{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:99px;padding:6px;margin:10px 0;box-shadow:var(--sh)}
.mn button{border:0;background:none;color:var(--tx);font-size:18px;width:36px;height:36px}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--sh);margin-bottom:10px;animation:rise .4s both}
.cal{background:var(--card);border-radius:22px;padding:14px;box-shadow:var(--sh);margin:10px 0}
.wk,.gd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:4px}
.wk span{font-size:12px;color:var(--mut);padding-bottom:6px}
.gd button{aspect-ratio:1;border:0;background:none;color:var(--tx);font-weight:600;border-radius:50%;position:relative;transition:transform .15s,background .25s}
.gd button:active{transform:scale(.85)}
.gd button.t{color:var(--ac);font-weight:800}
.gd button.w{background:var(--ac);color:#fff}
.gd u{position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor;opacity:.7}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:13px 15px;margin-bottom:8px;box-shadow:var(--sh);animation:rise .4s both}
.row .l{flex:1;min-width:0}.row .a{font-weight:700}.row .n{color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .e{font-weight:700;color:var(--ok)}.row .e.neg{color:var(--bad)}
.dot{width:36px;height:36px;border-radius:12px;background:var(--ln);display:grid;place-items:center;font-size:18px;flex:0 0 36px}
.sec{margin:18px 4px 8px;color:var(--mut);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.wide{width:100%;border:0;border-radius:16px;padding:13px;font-weight:700;background:var(--ln);color:var(--tx);margin:6px 0 10px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:28px;box-shadow:0 10px 24px rgba(214,51,108,.45);z-index:6}
.fab:active{transform:scale(.9)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:30}
.ov.on{display:flex;animation:fade .2s}
.pan{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,.9,.3,1)}
.pan h3{margin:0 0 8px;font-size:18px}
label.f{display:block;margin-top:12px;font-size:12px;color:var(--mut);font-weight:600}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-top:4px}
.btns{display:flex;gap:8px;margin-top:16px}.btns button{flex:1;border:0;border-radius:16px;padding:14px;font-weight:700}
.pri{background:var(--ac);color:#fff}.sc{background:var(--ln);color:var(--tx)}.dl{background:none;color:var(--bad)!important;flex:0 0 auto!important}
.msg{min-height:20px;font-size:13px;color:var(--bad);margin-top:8px;text-align:center}
.pg{height:6px;background:rgba(255,255,255,.3);border-radius:9px;overflow:hidden;margin:8px 0}
.pg i{display:block;height:100%;background:#fff;border-radius:9px}
.card .pg{background:var(--ln)}.card .pg i{background:var(--ac)}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.kp button{height:64px;border:0;border-radius:22px;font-size:22px;background:var(--card);color:var(--tx);box-shadow:var(--sh);transition:transform .1s}
.kp button:active{transform:scale(.92)}
.kp .op{background:var(--ac);color:#fff}.kp .fn{background:var(--ln)}.kp .z{grid-column:span 2;text-align:left;padding-left:26px}
.disp{font-size:44px;font-weight:300;text-align:right;padding:18px 6px;word-break:break-all;min-height:80px}
.log{font-size:14px;padding:10px 0;border-bottom:1px solid var(--ln)}.log small{color:var(--mut);display:block}
.on-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#aaa;margin-right:8px}
.on-dot.y{background:#2ecc71;animation:pulse 1.6s infinite}
.warn{color:var(--bad);font-weight:700;font-size:13px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln);font-size:15px}.kv:last-child{border:0}
.chips{display:flex;gap:6px;overflow-x:auto;margin:6px 0 10px;padding-bottom:2px}.chips button{border:0;background:var(--card);color:var(--mut);padding:7px 13px;border-radius:99px;font-weight:600;font-size:13px;white-space:nowrap;box-shadow:var(--sh)}.chips button.on{background:var(--ac);color:#fff}
.tile{flex:1;background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--sh);text-align:center}.tile b{display:block;font-size:20px}.tile span{font-size:12px;color:var(--mut)}
.sw{position:relative;overflow:hidden;border-radius:18px;margin-bottom:8px}
.sw-in{position:relative;z-index:1;background:var(--bg);border-radius:18px;transition:transform .25s cubic-bezier(.2,.9,.3,1);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.sw-in>.row,.sw-in>.card{margin-bottom:0}
.sw-act{position:absolute;right:0;top:0;bottom:0;width:96px;display:flex;z-index:0}
.sw-act button{flex:1;border:0;background:var(--bad);color:#fff;font-weight:700;border-radius:0 18px 18px 0;font-size:15px}
.undo{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;z-index:60;box-shadow:var(--sh);animation:up .3s cubic-bezier(.2,.9,.3,1)}
.undo button{border:0;background:none;color:var(--ac);font-weight:800;font-size:15px;padding:6px 4px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(46,204,113,0)}100%{box-shadow:0 0 0 0 rgba(46,204,113,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="bar" id="bar" hidden><button class="burger" data-act="menu" aria-label="Меню">☰ Меню</button><h1 id="title"></h1></div>
<div class="drawer" id="drawer" data-act="closemenu"><div class="menu" id="menu"></div></div>
<div id="app"><div class="empty">Загрузка…</div></div>
<button class="fab" id="fab" data-act="fab" hidden aria-label="Добавить">＋</button>
<div class="ov" id="ov"><div class="pan" id="pan"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://yjjtklsvghaenqvxncwq.supabase.co';
const SB_KEY='sb_publishable_ZA97aLheGD6zayIb8KVw-A_8sbzIulI';
const RATE=3.5, DAY_PAY=7000;
const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const KIND={bonus:'Премия',tip:'Чаевые',fine:'Штраф'};
const TABS=[['c','Чеки и зарплата'],['o','Заказы'],['p','Поставки'],['n','Заметки'],['k','Калькулятор'],['t','Итоги'],['a','Админка']];

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmt=n=>(Math.round((+n||0)*100)/100).toLocaleString('ru-RU');
const money=n=>fmt(n)+' ₸';
const dm=s=>s.slice(8)+'.'+s.slice(5,7);

let sb,me=null,role='worker',myName='',tab='c',mo=iso(new Date()).slice(0,7),today=iso(new Date());
let S={c:[],wd:[],adj:[],ord:[],notes:[],sup:[],boxes:[],aud:[],pres:[],prof:[]};
let calc={e:'',show:'0'};
let beatTimer=null;

function toast(t){ $('#app').insertAdjacentHTML('afterbegin',`<div class="msg" style="color:var(--ok)">${esc(t)}</div>`); setTimeout(()=>document.querySelector('.msg')?.remove(),2500); }
function who(id){ return S.prof.find(p=>p.id===id)?.name || '—'; }

async function log(action,details){ try{ await sb.from('audit').insert({action,details:details||''}); }catch(e){} }

async function boot(){
  sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  const {data}=await sb.auth.getSession();
  if(data.session) await enter(data.session.user); else loginScreen();
}

function loginScreen(msg){
  $('#bar').hidden=true; $('#fab').hidden=true;
  $('#app').innerHTML=`<div style="padding-top:40px">
    <div style="font-size:44px;text-align:center">🌷</div>
    <h2 style="text-align:center;margin:8px 0 18px">Зарплата</h2>
    <div class="card">
      <label class="f">Логин (email)</label><input id="lg" type="email" autocomplete="username" autocapitalize="none">
      <label class="f">Пароль</label><input id="lp" type="password" autocomplete="current-password">
      <div class="msg" id="lm">${esc(msg||'')}</div>
      <div class="btns"><button class="pri" data-act="login">Войти</button></div>
    </div></div>`;
}

async function enter(user){
  me=user;
  const {data:prof,error}=await sb.from('profiles').select('role,name').eq('id',user.id).maybeSingle();
  if(error||!prof){ await sb.auth.signOut(); me=null; return loginScreen('Аккаунт не привязан к приложению. Обратитесь к администратору.'); }
  role=prof.role; myName=prof.name;
  if(!S.prof.length){} 
  await reload();
  $('#bar').hidden=false; $('#fab').hidden=false;
  clearInterval(beatTimer); beat(); beatTimer=setInterval(beat,30000);
  go('c');
}

async function reload(){
  const [c,wd,adj,ord,nt,sup,bx,prof]=await Promise.all([
    sb.from('receipts').select('*').order('date',{ascending:false}),
    sb.from('work_days').select('*'),
    sb.from('adjustments').select('*').order('date',{ascending:false}),
    sb.from('orders').select('*').order('date'),
    sb.from('notes').select('*').order('created_at'),
    sb.from('supplies').select('*').order('delivery_date',{ascending:false}),
    sb.from('supply_boxes').select('*').order('created_at'),
    sb.from('profiles').select('id,name,role')]);
  const bad=[c,wd,adj,ord,nt,sup,bx,prof].find(r=>r.error);
  if(bad) throw bad.error;
  Object.assign(S,{c:c.data,wd:wd.data,adj:adj.data,ord:ord.data,notes:nt.data,sup:sup.data,boxes:bx.data,prof:prof.data});
  if(role==='admin'){
    const [a,p]=await Promise.all([
      sb.from('audit').select('*').order('at',{ascending:false}).limit(200),
      sb.from('presence').select('*')]);
    S.aud=a.data||[]; S.pres=p.data||[];
  }
}

async function beat(){
  if(!me||document.hidden) return;
  await sb.from('presence').upsert({user_id:me.id,last_seen:new Date().toISOString(),screen:TABS.find(t=>t[0]===tab)?.[1]||''});
}

function go(t){
  tab=t; closeMenu(); beat();
  $('#title').textContent=TABS.find(x=>x[0]===t)[1];
  render();
}

function menuHtml(){
  return `<div class="who">${esc(myName)} · ${role==='admin'?'администратор':'работник'}</div>`+
    TABS.filter(([k])=>k!=='a'||role==='admin').map(([k,l])=>`<button data-act="go" data-t="${k}" class="${tab===k?'on':''}">${l}</button>`).join('')+
    `<hr><button data-act="pwd">Сменить пароль</button><button data-act="logout">Выйти</button>`;
}
function openMenu(){ $('#menu').innerHTML=menuHtml(); $('#drawer').classList.add('on'); }
function closeMenu(){ $('#drawer').classList.remove('on'); }

function calc_(k){
  const rs=S.c.filter(r=>r.date.startsWith(k)), wd=S.wd.filter(w=>w.date.startsWith(k)), ad=S.adj.filter(a=>a.date.startsWith(k));
  const sales=rs.reduce((s,r)=>s+ +r.amount,0), e=rs.reduce((s,r)=>s+ +r.earn,0);
  const base=wd.reduce((s,w)=>s+ +w.pay,0), adj=ad.reduce((s,a)=>s+(a.kind==='fine'?-1:1)*+a.amount,0);
  return {rs,wd,ad,sales,e,base,adj,total:e+base+adj};
}

function render(){
  const app=$('#app');
  if(tab==='c') app.innerHTML=viewReceipts();
  else if(tab==='o') app.innerHTML=viewOrders();
  else if(tab==='p') app.innerHTML=viewSupplies();
  else if(tab==='n') app.innerHTML=viewNotes();
  else if(tab==='k') app.innerHTML=viewCalc();
  else if(tab==='t') app.innerHTML=viewTotals();
  else if(tab==='a') app.innerHTML=viewAdmin();
  $('#fab').hidden = !(tab==='c'||tab==='o'||tab==='p'||tab==='n');
  $('#fab').textContent = tab==='p'?'📦':tab==='n'?'✎':'＋';
  enhance();
}

function monthNav(){
  return `<div class="mn"><button data-act="mon" data-d="-1">‹</button><b>${MN[+mo.slice(5)-1]} ${mo.slice(0,4)}</b><button data-act="mon" data-d="1">›</button></div>`;
}

function viewReceipts(){
  const c=calc_(mo), wdSet=new Set(S.wd.map(w=>w.date)), rcDays=new Set(S.c.map(r=>r.date));
  const [y,m]=mo.split('-').map(Number), dim=new Date(y,m,0).getDate(), first=(new Date(y,m-1,1).getDay()+6)%7;
  let g='<div class="wk">'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<span>${d}</span>`).join('')+'</div><div class="gd">'+'<i></i>'.repeat(first);
  for(let d=1;d<=dim;d++){ const id=mo+'-'+pad(d); g+=`<button data-act="day" data-d="${id}" class="${wdSet.has(id)?'w':''} ${id===today?'t':''}">${d}${rcDays.has(id)?'<u></u>':''}</button>`; }
  g+='</div>';
  const list=c.rs.map(r=>`<div class="row" data-act="editr" data-id="${r.id}"><div class="dot">${+r.amount<0?'↩️':'🧾'}</div><div class="l"><div class="a">${money(r.amount)}</div><div class="n">${esc(r.note)||'без заметки'} · ${dm(r.date)}</div></div><div class="e ${+r.earn<0?'neg':''}">${+r.earn>0?'+':''}${money(r.earn)}</div></div>`).join('');
  const adjs=c.ad.map(a=>`<div class="row" data-act="edita" data-id="${a.id}"><div class="dot">${a.kind==='fine'?'⚠️':a.kind==='tip'?'💝':'🎁'}</div><div class="l"><div class="a">${KIND[a.kind]}</div><div class="n">${esc(a.note)||'—'} · ${dm(a.date)}</div></div><div class="e ${a.kind==='fine'?'neg':''}">${a.kind==='fine'?'−':'+'}${money(a.amount)}</div></div>`).join('');
  return `${monthNav()}
  <div class="hero"><small>Зарплата за месяц</small><div class="big">${money(c.total)}</div>
    <div class="stats"><div><b>${money(c.base)}</b>оклад · ${c.wd.length} дн.</div><div><b>${money(c.e)}</b>${RATE}% с продаж</div><div><b>${money(c.adj)}</b>премии/штрафы</div><div><b>${c.rs.length}</b>чеков</div></div></div>
  <div class="cal">${g}<div style="text-align:center;margin-top:10px;font-size:14px"><b>${c.wd.length}</b> раб. дн. · нажмите на число, чтобы отметить день</div></div>
  <div class="sec"><span>Чеки</span><span>${money(c.sales)}</span></div>${list||'<div class="empty">Чеков пока нет. Нажмите ＋</div>'}
  <div class="sec"><span>Премии, штрафы, чаевые</span></div>${adjs||'<div class="empty" style="padding:10px">Нет</div>'}
  <button class="wide" data-act="newa">＋ Премия, штраф или чаевые</button>`;
}

function viewOrders(){
  const td=today, L=S.ord.slice().sort((a,b)=>(a.done-b.done)||(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  if(!L.length) return '<div class="empty">Заказов нет. Нажмите ＋</div>';
  return L.map(o=>{ const late=!o.done&&o.date<td; return `<div class="row" style="${o.done?'opacity:.5':''}">
    <button class="dot" data-act="odone" data-id="${o.id}" style="border:0">${o.done?'✅':'⬜'}</button>
    <div class="l" data-act="edito" data-id="${o.id}"><div class="a" style="${o.done?'text-decoration:line-through':''}">${esc(o.title)}</div>
    <div class="n" style="${late?'color:var(--bad)':''}">${o.date===td?'сегодня':dm(o.date)}${o.time?' · '+esc(o.time):''}${late?' · просрочен':''}</div></div>
    ${+o.sum?`<div class="e">${money(o.sum)}</div>`:''}</div>`; }).join('');
}

function viewNotes(){
  const L=S.notes.filter(n=>n.month===mo);
  return `${monthNav()}<div class="sec"><span>Заметки за ${MN[+mo.slice(5)-1]}</span></div>`+
    (L.map(n=>`<div class="card" style="display:flex;gap:10px;align-items:start"><div style="flex:1;white-space:pre-wrap">${esc(n.text)}</div>${n.created_by===me.id||role==='admin'?`<button data-act="delnote" data-id="${n.id}" style="border:0;background:none;color:var(--bad)">✕</button>`:''}</div>`).join('')||'<div class="empty">Заметок за этот месяц нет</div>')+
    `<div style="font-size:12px;color:var(--mut);text-align:center">Заметки привязаны к месяцу: в новом месяце список начнётся заново, старые остаются в своём месяце.</div>`;
}

function viewSupplies(){
  if(!S.sup.length) return '<div class="empty">Поставок нет. Нажмите 📦, чтобы создать</div>';
  const list=S.sup.slice().sort((x,y)=>(x.status==='closed')-(y.status==='closed')||y.delivery_date.localeCompare(x.delivery_date));
  return list.map(s=>{
    const bs=S.boxes.filter(b=>b.supply_id===s.id), done=bs.filter(b=>b.status==='unpacked').length, closed=s.status==='closed';
    return `<div class="card" data-act="opensup" data-id="${s.id}" style="cursor:pointer;${closed?'opacity:.6':''}">
      <div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(s.supplier)||'Поставка'}</b><span style="color:var(--mut)">${dm(s.delivery_date)}${closed?' · завершена':''}</span></div>
      <div class="pg"><i style="width:${bs.length?done/bs.length*100:0}%"></i></div>
      <div style="font-size:13px;color:var(--mut)">коробок: ${bs.length} · разобрано: ${done}</div></div>`;
  }).join('');
}

function viewCalc(){
  const keys=['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','='];
  return `<div class="card" style="min-height:120px"><div class="disp">${esc(calc.show)}</div></div>
  <div class="kp">${keys.map(k=>{
    const cls=/[÷×−+=]/.test(k)?'op':/[C±%]/.test(k)?'fn':'';
    const zero=k==='0'?' z':'';
    return `<button class="${cls}${zero}" data-act="key" data-k="${k}">${k}</button>`; }).join('')}</div>
  <div style="font-size:12px;color:var(--mut);text-align:center;margin-top:14px">Как на iPhone: «200 + 10 %» даёт 220</div>`;
}

const fdt=t=>new Date(t).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});

function byPerson(k){
  return S.prof.filter(p=>p.role==='worker').map(p=>{
    const rs=S.c.filter(r=>r.date.startsWith(k)&&r.created_by===p.id);
    const wd=S.wd.filter(w=>w.date.startsWith(k)&&w.created_by===p.id);
    const ad=S.adj.filter(a=>a.date.startsWith(k)&&a.created_by===p.id);
    const sales=rs.reduce((s,r)=>s+ +r.amount,0), e=rs.reduce((s,r)=>s+ +r.earn,0);
    const base=wd.reduce((s,w)=>s+ +w.pay,0), adj=ad.reduce((s,a)=>s+(a.kind==='fine'?-1:1)*+a.amount,0);
    return {p,rs,wd,sales,e,base,adj,total:e+base+adj};
  });
}

function checks(){
  const out=[], rs=S.c.filter(r=>r.date.startsWith(mo));
  rs.filter(r=>Math.abs(+r.amount)>300000).forEach(r=>out.push(['⚠️','Крупный чек '+money(r.amount)+' · '+dm(r.date)+(r.note?' · '+r.note:'')]));
  const seen={}; rs.forEach(r=>{const k=r.date+'|'+r.amount; seen[k]=(seen[k]||0)+1;});
  Object.entries(seen).filter(([,n])=>n>1).forEach(([k,n])=>{const [d,a]=k.split('|'); out.push(['🔁','Возможный дубль: '+money(a)+' за '+dm(d)+' (×'+n+')']);});
  const wdSet=new Set(S.wd.map(w=>w.date));
  rs.filter(r=>!wdSet.has(r.date)).forEach(r=>out.push(['📅','Чек без рабочего дня: '+dm(r.date)+' · '+money(r.amount)]));
  S.ord.filter(o=>!o.done&&o.date<today).forEach(o=>out.push(['⏰','Просрочен заказ: '+o.title+' ('+dm(o.date)+')']));
  S.boxes.filter(b=>b.status==='checked'&&b.counted!=null&&b.expected!=null&&+b.counted!==+b.expected).forEach(b=>out.push(['📦','Не сходится: '+b.label+' — по надписи '+b.expected+', посчитано '+b.counted]));
  S.boxes.filter(b=>b.status==='pending').forEach(b=>out.push(['📦','Коробка не проверена: '+b.label]));
  return out;
}

function download(name,text,type){
  const blob=new Blob([text],{type:type||'text/plain;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- swipe, long press, undo ---------- */
let swipedAt=0, g=null, undoTimer=null, pendingCommit=null;
const TABLE_OF={receipt:['receipts','c'],adj:['adjustments','adj'],order:['orders','ord'],supply:['supplies','sup'],box:['supply_boxes','boxes']};
function findItem(kind,id){ const [,key]=TABLE_OF[kind]||[]; return key?S[key].find(x=>x.id===id):null; }
function closeAllSwipes(){ document.querySelectorAll('.sw.open').forEach(w=>{ w.classList.remove('open'); w.querySelector('.sw-in').style.transform=''; }); }
function enhance(){
  document.querySelectorAll('[data-act="editr"],[data-act="edita"],[data-act="edito"],[data-act="opensup"]').forEach(el=>{
    if(el.parentElement&&el.parentElement.classList.contains('sw-in')) return;
    const kind={editr:'receipt',edita:'adj',edito:'order',opensup:'supply'}[el.dataset.act];
    const wrap=document.createElement('div'); wrap.className='sw'; wrap.dataset.swipe=kind; wrap.dataset.id=el.dataset.id;
    const inner=document.createElement('div'); inner.className='sw-in';
    const act=document.createElement('div'); act.className='sw-act';
    act.innerHTML=`<button data-act="swdel" data-kind="${kind}" data-id="${el.dataset.id}">Удалить</button>`;
    el.parentNode.insertBefore(wrap,el); inner.appendChild(el); wrap.appendChild(act); wrap.appendChild(inner);
  });
}
document.addEventListener('pointerdown',e=>{
  const w=e.target.closest('.sw'); if(!w||e.target.closest('.sw-act')) return;
  g={w,x:e.clientX,y:e.clientY,dx:0,lock:null,fired:false};
  g.hold=setTimeout(()=>{ if(g&&g.w===w&&!g.lock){ g.fired=true; swipedAt=Date.now(); navigator.vibrate&&navigator.vibrate(15); openActions(w.dataset.swipe,w.dataset.id); } },450);
},{passive:true});
document.addEventListener('pointermove',e=>{
  if(!g) return;
  const dx=e.clientX-g.x, dy=e.clientY-g.y;
  if(!g.lock&&(Math.abs(dx)>8||Math.abs(dy)>8)){ g.lock=Math.abs(dx)>Math.abs(dy)?'x':'y'; clearTimeout(g.hold); }
  if(g.lock==='x'){
    const base=g.w.classList.contains('open')?-96:0;
    const v=Math.min(0,Math.max(-110,base+dx)); g.dx=v;
    const inn=g.w.querySelector('.sw-in'); inn.style.transition='none'; inn.style.transform=`translateX(${v}px)`;
    closeOthers(g.w);
  }
},{passive:true});
function closeOthers(keep){ document.querySelectorAll('.sw.open').forEach(w=>{ if(w!==keep){ w.classList.remove('open'); w.querySelector('.sw-in').style.transform=''; } }); }
function endGesture(){
  if(!g) return; clearTimeout(g.hold);
  if(g.lock==='x'){
    const inn=g.w.querySelector('.sw-in'); inn.style.transition='';
    const open=g.dx<-48;
    g.w.classList.toggle('open',open); inn.style.transform=open?'translateX(-96px)':'';
    swipedAt=Date.now();
  }
  g=null;
}
document.addEventListener('pointerup',endGesture);
document.addEventListener('pointercancel',endGesture);

function toastUndo(text,onUndo,commit){
  flushPending();
  pendingCommit=commit;
  const d=document.createElement('div'); d.id='undo'; d.className='undo';
  d.innerHTML=`<span>${esc(text)}</span><button>Отменить</button>`;
  document.body.appendChild(d);
  d.querySelector('button').onclick=async()=>{ clearTimeout(undoTimer); pendingCommit=null; d.remove(); await reload(); render(); };
  undoTimer=setTimeout(flushPending,5000);
}
async function flushPending(){
  if(!pendingCommit) return;
  const p=pendingCommit; pendingCommit=null; clearTimeout(undoTimer);
  document.getElementById('undo')?.remove();
  try{ await p(); }catch(e){ alert('Не удалилось: '+(e.message||e)); }
  await reload(); render();
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden) flushPending(); });

async function deleteRecord(kind,id){
  closeAllSwipes();
  const [table,key]=TABLE_OF[kind]; const item=S[key].find(x=>x.id===id); if(!item) return;
  const label={receipt:'Чек '+money(item.amount),adj:'Начисление '+money(item.amount),order:'Заказ «'+item.title+'»',supply:'Поставка «'+(item.supplier||'без названия')+'»',box:'Коробка «'+item.label+'»'}[kind];
  const removedBoxes=kind==='supply'?S.boxes.filter(b=>b.supply_id===id):[];
  S[key]=S[key].filter(x=>x.id!==id);
  if(kind==='supply') S.boxes=S.boxes.filter(b=>b.supply_id!==id);
  render();
  toastUndo(label+' удалён',null,async()=>{
    if(kind==='supply'){
      const {error}=await sb.from('supplies').delete().eq('id',id); if(error) throw error;
      const photos=removedBoxes.map(b=>b.photo_path).filter(Boolean);
      if(photos.length) await sb.storage.from('supply-photos').remove(photos);
    }else{
      const {error}=await sb.from(table).delete().eq('id',id); if(error) throw error;
    }
    await log('Удалено: '+label,'');
  });
}
function openActions(kind,id){
  let rows;
  if(kind==='receipt') rows=[['editr','Изменить'],['swdel','Удалить чек',1]];
  else if(kind==='adj') rows=[['edita','Изменить'],['swdel','Удалить',1]];
  else if(kind==='order') rows=[['edito','Изменить'],['swdel','Удалить заказ',1]];
  else if(kind==='supply'){ const s=S.sup.find(x=>x.id===id); rows=[['opensup','Открыть'],s&&s.status==='closed'?['supreopen','Вернуть в работу']:['supdone','Завершить поставку'],['swdel','Удалить поставку',1]]; }
  else if(kind==='box') rows=[['swdel','Удалить коробку',1]];
  else return;
  openSheet(`<h3>Действия</h3>${rows.map(([a,l,d])=>`<button class="wide" style="${d?'color:var(--bad)':''}" data-act="${a}" data-id="${id}" data-kind="${kind}">${l}</button>`).join('')}<div class="btns"><button class="sc" data-act="closesheet">Отмена</button></div>`);
}

/* ---------- actions ---------- */
async function save(table,payload,id,label){
  const q=id?sb.from(table).update(payload).eq('id',id):sb.from(table).insert(payload);
  const {error}=await q;
  if(error) throw error;
  await log((id?'Изменено: ':'Добавлено: ')+label, JSON.stringify(payload).slice(0,160));
}

document.addEventListener('input',e=>{
  if(e.target.id==='f_amt'||e.target.id==='f_ret'){
    const a=parseFloat(($('#f_amt')?.value||'0').replace(',','.'))||0, neg=$('#f_ret')?.checked;
    const p=$('#f_prev'); if(p) p.textContent=a?(neg?'−':'+')+money(a*RATE/100)+' к зарплате':'';
  }
});
document.addEventListener('change',e=>{ if(e.target.id==='f_ret') e.target.dispatchEvent(new Event('input',{bubbles:true})); });

document.addEventListener('click',async e=>{
  if(Date.now()-swipedAt<350){ return; }
  const t=e.target.closest('[data-act]');
  if(!t){ closeAllSwipes(); return; }
  if(t.dataset.act!=='swdel') closeOthers(t.closest('.sw'));
  if(t.id==='drawer'&&e.target!==t) return;
  const act=t.dataset.act, id=t.dataset.id;
  const err=m=>{ const el=$('#f_msg'); if(el) el.textContent=m; };
  try{
    switch(act){
      case 'menu': openMenu(); break;
      case 'closemenu': if(e.target.id==='drawer') closeMenu(); break;
      case 'go': go(t.dataset.t); break;
      case 'pwd': { const p=prompt('Новый пароль (не короче 6 символов)'); if(p&&p.length>=6){ const {error}=await sb.auth.updateUser({password:p}); if(error) alert(error.message); else { alert('Пароль изменён'); await log('Смена пароля',myName);} } else if(p!==null) alert('Пароль слишком короткий'); break; }
      case 'logout': await sb.auth.signOut(); me=null; closeMenu(); loginScreen(); break;
      case 'login': {
        const em=$('#lg').value.trim(), pw=$('#lp').value;
        $('#lm').textContent='Входим…';
        const {data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
        if(error){ $('#lm').textContent='Неверный логин или пароль'; break; }
        await sb.from('audit').insert({action:'Вход',details:em});
        await enter(data.user); break; }
      case 'mon': { const [y,m]=mo.split('-').map(Number); mo=iso(new Date(y,m-1+ +t.dataset.d,1)).slice(0,7); render(); break; }
      case 'day': {
        const ex=S.wd.find(w=>w.date===t.dataset.d);
        if(ex){ const {error}=await sb.from('work_days').delete().eq('date',t.dataset.d); if(error) throw error; await log('Снят рабочий день',t.dataset.d); }
        else { const {error}=await sb.from('work_days').insert({date:t.dataset.d,pay:DAY_PAY}); if(error) throw error; await log('Рабочий день',t.dataset.d+' · '+money(DAY_PAY)); }
        await reload(); render(); break; }
      case 'newr': openSheet(formReceipt(null)); break;
      case 'editr': openSheet(formReceipt(S.c.find(r=>r.id===id))); break;
      case 'saver': {
        const a=parseFloat(($('#f_amt').value||'').replace(',','.'));
        if(!(a>0)) return err('Введите сумму');
        const date=$('#f_date').value||today, neg=$('#f_ret').checked, amt=neg?-a:a;
        const row={date,amount:amt,rate:RATE,earn:Math.round(amt*RATE)/100,note:$('#f_note').value.trim()};
        await save('receipts',row,id||null,'чек '+money(amt)+' ('+date+')');
        if(!S.wd.some(w=>w.date===date)&&!id) await sb.from('work_days').insert({date,pay:DAY_PAY});
        closeSheet(); await reload(); render(); toast('Сохранено'); break; }
      case 'delr': { if(!confirm('Удалить чек?')) return; const r=S.c.find(x=>x.id===id); await sb.from('receipts').delete().eq('id',id); await log('Удалён чек',money(r?.amount)+' '+r?.date); closeSheet(); await reload(); render(); break; }
      case 'newa': openSheet(formAdj(null)); break;
      case 'edita': openSheet(formAdj(S.adj.find(a=>a.id===id))); break;
      case 'savea': {
        const a=parseFloat(($('#f_amt').value||'').replace(',','.')); if(!(a>0)) return err('Введите сумму');
        const row={kind:$('#f_kind').value,amount:a,date:$('#f_date').value||today,note:$('#f_note').value.trim()};
        await save('adjustments',row,id||null,KIND[row.kind]+' '+money(a));
        closeSheet(); await reload(); render(); break; }
      case 'dela': { if(!confirm('Удалить?')) return; const a=S.adj.find(x=>x.id===id); await sb.from('adjustments').delete().eq('id',id); await log('Удалено: '+KIND[a?.kind],money(a?.amount)); closeSheet(); await reload(); render(); break; }
      case 'odone': { const o=S.ord.find(x=>x.id===id); await sb.from('orders').update({done:!o.done}).eq('id',id); await log(o.done?'Заказ снова в работе':'Заказ выполнен',o.title); await reload(); render(); break; }
      case 'neww': case 'newo': openSheet(formOrder(null)); break;
      case 'edito': openSheet(formOrder(S.ord.find(o=>o.id===id))); break;
      case 'saveo': {
        const title=$('#f_title').value.trim(); if(!title) return err('Опишите заказ');
        const row={title,date:$('#f_date').value||today,time:$('#f_time').value||null,sum:parseFloat(($('#f_sum').value||'0').replace(',','.'))||0};
        await save('orders',row,id||null,'заказ '+title);
        closeSheet(); await reload(); render(); break; }
      case 'delo': { if(!confirm('Удалить заказ?')) return; const o=S.ord.find(x=>x.id===id); await sb.from('orders').delete().eq('id',id); await log('Удалён заказ',o?.title); closeSheet(); await reload(); render(); break; }
      case 'savenote': {
        const text=$('#f_text').value.trim(); if(!text) return err('Пустая заметка');
        const {error}=await sb.from('notes').insert({month:mo,text}); if(error) throw error;
        await log('Заметка '+mo,text.slice(0,80)); closeSheet(); await reload(); render(); break; }
      case 'delnote': { if(!confirm('Удалить заметку?')) return; await sb.from('notes').delete().eq('id',id); await log('Удалена заметка',''); await reload(); render(); break; }
      case 'newsup': case 'fab-sup': openSheet(formSupply()); break;
      case 'savesup': {
        const row={delivery_date:$('#f_date').value||today,supplier:$('#f_sup').value.trim()};
        await save('supplies',row,null,'поставка '+(row.supplier||''));
        closeSheet(); await reload(); render(); break; }
      case 'opensup': openSupply(id); break;
      case 'newbox': openSheet(formBox(id)); break;
      case 'savebox': {
        const label=$('#f_label').value.trim(); if(!label) return err('Напишите надпись');
        const row={supply_id:id,label,expected:parseInt($('#f_exp').value)||null,status:'pending'};
        await save('supply_boxes',row,null,'коробка '+label);
        await reload(); openSupply(id); break; }
      case 'count': {
        const b=S.boxes.find(x=>x.id===id);
        const input=document.createElement('input'); input.type='file'; input.accept='image/*'; input.capture='environment';
        input.onchange=async()=>{
          const f=input.files[0]; if(!f) return;
          const n=parseInt(prompt('Сколько коробок/штук посчитали? (по фото)'));
          if(isNaN(n)) return alert('Нужно число');
          const path=b.id+'/'+Date.now()+'.jpg';
          const up=await sb.storage.from('supply-photos').upload(path,f,{contentType:f.type||'image/jpeg'});
          if(up.error) return alert('Фото не загрузилось: '+up.error.message);
          await sb.from('supply_boxes').update({counted:n,photo_path:path,status:'checked'}).eq('id',id);
          await log('Проверена коробка',b.label+': '+n+' шт');
          await reload(); openSupply(b.supply_id);
        };
        input.click(); break; }
      case 'viewphoto': {
        const b=S.boxes.find(x=>x.id===id);
        const {data}=await sb.storage.from('supply-photos').createSignedUrl(b.photo_path,600);
        if(data?.signedUrl) window.open(data.signedUrl,'_blank'); break; }
      case 'unpack': {
        if(t.dataset.mism==='1'&&!confirm('Количество не совпадает с надписью. Всё равно отметить разобранной?')) return;
        const b=S.boxes.find(x=>x.id===id);
        await sb.from('supply_boxes').update({status:'unpacked'}).eq('id',id);
        await log('Разобрана коробка',b.label); await reload(); openSupply(b.supply_id); break; }
      case 'fab': {
        if(tab==='c') openSheet(formReceipt(null));
        else if(tab==='o') openSheet(formOrder(null));
        else if(tab==='p') openSheet(formSupply());
        else if(tab==='n') openSheet(formNote());
        break; }
      case 'closesheet': closeSheet(); break;
      case 'key': pressKey(t.dataset.k); render(); break;
      case 'xls': await exportCsv(); break;
      case 'swdel': { const item=findItem(t.dataset.kind,id); const supId=item&&item.supply_id; closeSheet(); await deleteRecord(t.dataset.kind,id); if(t.dataset.kind==='box'&&supId&&S.sup.some(x=>x.id===supId)) openSupply(supId); break; }
      case 'supdel': { closeSheet(); await deleteRecord('supply',id); break; }
      case 'supdone': case 'supreopen': {
        const st=act==='supdone'?'closed':'open', sup=S.sup.find(x=>x.id===id);
        const {error}=await sb.from('supplies').update({status:st}).eq('id',id); if(error) throw error;
        await log(st==='closed'?'Поставка завершена':'Поставка снова в работе',sup?.supplier||'');
        await reload(); render(); if($('#ov').classList.contains('on')) openSupply(id); break; }
      case 'admf': adm.f=t.dataset.v; render(); break;
      case 'admw': adm.who=t.dataset.v; render(); break;
      case 'csvpeople': {
        const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
        const rows=[['Имя','Раб. дней','Чеков','Продажи','% с продаж','Оклад','Премии и штрафы','Итого']];
        byPerson(mo).forEach(x=>rows.push([x.p.name,x.wd.length,x.rs.length,x.sales,x.e,x.base,x.adj,x.total]));
        download('svodka-'+mo+'.csv','\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n'),'text/csv;charset=utf-8'); break; }
      case 'backup': {
        const data={exported:new Date().toISOString(),receipts:S.c,work_days:S.wd,adjustments:S.adj,orders:S.ord,notes:S.notes,supplies:S.sup,supply_boxes:S.boxes,profiles:S.prof};
        download('zarplata-backup-'+today+'.json',JSON.stringify(data,null,2),'application/json');
        await log('Выгрузка копии данных',''); break; }
    }
  }catch(ex){ alert('Ошибка: '+(ex.message||ex)); }
});

/* ---------- calculator (iPhone style) ---------- */
function evalExpr(s){
  const x=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  if(!/^[\d.+\-*/() ]+$/.test(x)) return NaN;
  try{ return Function('"use strict";return ('+x+')')(); }catch(e){ return NaN; }
}
function pressKey(k){
  const ops=/[+\-×÷−]/;
  if(/\d/.test(k)){ calc.e=(calc.show==='0'&&!ops.test(calc.e.slice(-1))&&calc.e==='')?k:calc.e+k; }
  else if(k==='.'){ const last=calc.e.split(/[+\-×÷−]/).pop(); if(!last.includes('.')) calc.e+= (last===''?'0.':'.'); }
  else if(k==='C'){ calc.e=''; }
  else if(k==='±'){ const m=calc.e.match(/(-?\d+\.?\d*)$/); if(m){ const v=m[1]; calc.e=calc.e.slice(0,calc.e.length-v.length)+(v.startsWith('-')?v.slice(1):'-'+v); } }
  else if(k==='%'){
    const m=calc.e.match(/(\d+\.?\d*)$/); if(!m) return;
    const num=+m[1], pre=calc.e.slice(0,calc.e.length-m[1].length);
    const op=pre.match(/^(.*)([+\-×÷−])$/);
    if(op){ const base=evalExpr(op[1]); const v=base*num/100; calc.e=op[1]+op[2]+String(+v.toFixed(6)); }
    else calc.e=String(+(num/100).toFixed(6));
  }
  else if(ops.test(k)){ if(calc.e===''&&k!=='−') return; if(ops.test(calc.e.slice(-1))) calc.e=calc.e.slice(0,-1); calc.e+=k; }
  else if(k==='='){ const v=evalExpr(calc.e); if(!isNaN(v)){ calc.show=String(+v.toFixed(2)); calc.e=calc.show; return; } calc.show='Ошибка'; calc.e=''; return; }
  calc.show = calc.e===''?'0':calc.e;
}

/* ---------- CSV export (Excel) ---------- */
async function exportCsv(){
  const c=calc_(mo);
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['Дата','Тип','Описание','Сумма','Начислено']];
  c.rs.forEach(r=>rows.push([r.date,+r.amount<0?'Возврат':'Чек',r.note||'',r.amount,r.earn]));
  c.wd.forEach(w=>rows.push([w.date,'Рабочий день','',w.pay,w.pay]));
  c.ad.forEach(a=>rows.push([a.date,KIND[a.kind],a.note||'',a.amount,(a.kind==='fine'?-1:1)*a.amount]));
  rows.sort((a,b)=>String(a[0]).localeCompare(String(b[0])));
  rows.push(['','','ИТОГО','',c.total]);
  const csv='\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='zarplata-'+mo+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

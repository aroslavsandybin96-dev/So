<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Моя зарплата</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Зарплата"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#d6336c">
<style>
:root{--bg:#fbf6f4;--card:#fff;--tx:#2a1f25;--mut:#8a7a82;--ac:#d6336c;--ac2:#ff7aa8;--ok:#3f8a5a;--bad:#c0392b;--ln:#f0e4e8;--sh:0 8px 30px rgba(214,51,108,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16101a;--card:#211826;--tx:#f5eaf0;--mut:#a592a0;--ac:#ff5c93;--ac2:#b8336a;--ok:#6fcf97;--bad:#ff7b6b;--ln:#33263a;--sh:0 8px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16101a;--card:#211826;--tx:#f5eaf0;--mut:#a592a0;--ac:#ff5c93;--ac2:#b8336a;--ok:#6fcf97;--bad:#ff7b6b;--ln:#33263a;--sh:0 8px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px 16px 120px}
.top{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px}
.top h1{font-size:20px;margin:0}.mn{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:99px;padding:4px;box-shadow:var(--sh)}
.mn button{border:0;background:none;color:var(--tx);font-size:18px;width:34px;height:34px;border-radius:50%;cursor:pointer}.mn span{min-width:96px;text-align:center;font-weight:600;font-size:14px}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:26px;padding:22px;box-shadow:var(--sh);animation:rise .6s both}
.hero small{opacity:.85}.big{font-size:44px;font-weight:800;letter-spacing:-1px;margin:4px 0}
.stats{display:flex;gap:18px;font-size:13px;opacity:.95}.stats b{display:block;font-size:16px}
.chart{display:flex;align-items:flex-end;gap:3px;height:44px;margin-top:16px}.chart i{flex:1;background:rgba(255,255,255,.35);border-radius:3px;min-height:3px;transform-origin:bottom;animation:grow .6s both}.chart i.t{background:#fff}
.sec{margin:22px 4px 8px;color:var(--mut);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:13px 15px;margin-bottom:8px;box-shadow:var(--sh);cursor:pointer;animation:rise .45s both;transition:transform .15s}.row:active{transform:scale(.98)}
.row .l{flex:1;min-width:0}.row .a{font-weight:700}.row .n{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .e{font-weight:700;color:var(--ok)}.row .e.neg{color:var(--bad)}
.dot{width:36px;height:36px;border-radius:12px;background:var(--ln);display:grid;place-items:center;font-size:18px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 40%)}
nav button.t{border:0;background:var(--card);color:var(--mut);padding:12px 20px;border-radius:99px;font-weight:600;box-shadow:var(--sh);cursor:pointer}nav button.t.on{color:var(--bg);background:var(--tx)}
.fab{border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:26px;width:54px;height:54px;border-radius:50%;box-shadow:0 10px 24px rgba(214,51,108,.45);cursor:pointer;margin-top:-10px;transition:transform .2s}.fab:active{transform:scale(.9) rotate(90deg)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:9;backdrop-filter:blur(3px)}
#sheet.on{display:flex;animation:fade .25s}
.pan{width:100%;max-width:520px;background:var(--card);border-radius:28px 28px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .35s cubic-bezier(.2,.9,.3,1)}
.cam{display:flex;gap:10px;align-items:center;justify-content:center;width:100%;border:2px dashed var(--ac);color:var(--ac);background:none;border-radius:18px;padding:16px;font-weight:700;font-size:16px;cursor:pointer}
label.f{display:block;margin-top:12px;font-size:12px;color:var(--mut);font-weight:600}
input[type=text],input[type=date]{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-top:4px}
#amt{font-size:34px;font-weight:800;text-align:center;padding:10px}
.prev{text-align:center;color:var(--ok);font-weight:700;margin:8px 0;min-height:24px}
.btns{display:flex;gap:8px;margin-top:14px}.btns button{flex:1;border:0;border-radius:16px;padding:15px;font-weight:700;font-size:16px;cursor:pointer}.pri{background:var(--ac);color:#fff}.sec2{background:var(--ln);color:var(--tx)}.del{background:none;color:var(--bad);flex:0 0 auto!important}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px}
.st{text-align:center;font-size:13px;color:var(--mut);min-height:18px;margin-top:6px}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--sh);margin-bottom:10px;animation:rise .45s both}
.on-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#aaa;margin-right:8px}.on-dot.y{background:#2ecc71;box-shadow:0 0 0 0 #2ecc71;animation:pulse 1.6s infinite}
.chips{display:flex;gap:6px;margin:6px 0 10px;overflow-x:auto}.chips button{border:0;background:var(--card);color:var(--mut);padding:7px 14px;border-radius:99px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}.chips button.on{background:var(--ac);color:#fff}
.log{font-size:14px;padding:10px 0;border-bottom:1px solid var(--ln)}.log small{color:var(--mut);display:block}
.set{display:flex;gap:8px}.set input{flex:1}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:18px}
.cal{background:var(--card);border-radius:22px;padding:14px;box-shadow:var(--sh);margin-top:14px;animation:rise .5s both}.wk,.gd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:4px}.wk span{font-size:12px;color:var(--mut);padding-bottom:6px}.gd button{aspect-ratio:1;border:0;background:none;color:var(--tx);font:inherit;font-weight:600;border-radius:50%;position:relative;cursor:pointer;transition:transform .15s,background .25s,color .25s}.gd button:active{transform:scale(.85)}.gd button.t{color:var(--ac);font-weight:800}.gd button.p{background:var(--ln);color:var(--ac)}.gd button.w{background:var(--ac);color:#fff}.gd u{position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor;opacity:.7}.cn{text-align:center;margin-top:10px}.cal small{display:block;text-align:center;color:var(--mut);font-size:12px;margin-top:2px}
nav button.t{padding:11px 12px;font-size:14px}.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:9;backdrop-filter:blur(3px)}.ov.on{display:flex;animation:fade .25s}.ov input,.ov select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-top:4px}.wide{width:100%;border:0;border-radius:16px;padding:13px;font-weight:700;cursor:pointer;margin:4px 0 8px;background:var(--ln);color:var(--tx);font-size:15px}.pg{height:6px;background:rgba(255,255,255,.3);border-radius:9px;overflow:hidden;margin:6px 0 10px}.pg i{display:block;height:100%;background:#fff;border-radius:9px;transition:width .8s}.card .pg{background:var(--ln)}.card .pg i{background:var(--ac)}.bars{display:flex;gap:8px;height:86px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;text-align:center;font-size:11px;color:var(--mut)}.bars i{display:block;background:var(--ac2);border-radius:6px;margin-bottom:4px;animation:grow .6s both;transform-origin:bottom}.bars .cu i{background:var(--ac)}.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--ln)}.kv:last-child{border:0}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(46,204,113,0)}100%{box-shadow:0 0 0 0 rgba(46,204,113,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"><div class="empty">Загружаю…</div></div>
<nav id="nav"></nav>
<div id="sheet"><div class="pan">
<button class="cam" id="cam">📷 Сканировать чек</button>
<textarea id="scan" rows="3" hidden placeholder="Нажмите сюда, выберите «Сканировать текст» и наведите камеру на чек" style="width:100%;margin-top:8px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:10px"></textarea>
<input type="file" id="file" accept="image/*" capture="environment" hidden>
<div class="st" id="st"></div>
<label class="f">Сумма чека</label>
<input id="amt" type="text" inputmode="decimal" placeholder="0" autocomplete="off">
<div class="prev" id="prev"></div>
<label class="f">Дата</label><input id="dt" type="date">
<label class="f">Заметка (необязательно)</label><input id="nt" type="text" placeholder="Например: букет невесты">
<label class="chk"><input type="checkbox" id="ret"> Возврат (вычесть из зарплаты)</label>
<div class="btns"><button class="del" id="del" hidden>Удалить</button><button class="sec2" id="cx">Отмена</button><button class="pri" id="ok">Сохранить</button></div>
</div></div>
<div class="ov" id="sheet2"><div class="pan"><b id="h2t" style="font-size:18px"></b>
<div id="k2w"><label class="f">Вид</label><select id="k2"><option value="bonus">Премия</option><option value="tip">Чаевые</option><option value="fine">Штраф</option></select></div>
<label class="f">Описание</label><input id="t2" type="text" placeholder="Клиент, букет, причина">
<label class="f">Сумма</label><input id="a2" type="text" inputmode="decimal">
<label class="f">Дата</label><input id="d2" type="date"><div id="hr2w"><label class="f">Время</label><input id="hr2" type="time"></div>
<div class="st" id="st2"></div><div class="btns"><button class="del" id="del2" hidden>Удалить</button><button class="sec2" id="cx2">Отмена</button><button class="pri" id="ok2">Сохранить</button></div></div></div>
<script>
(function(){const K='fl:',subs={};
const ld=c=>{try{return JSON.parse(localStorage.getItem(K+c)||'{}')}catch(e){return{}}};
const sv=(c,o)=>{localStorage.setItem(K+c,JSON.stringify(o));(subs[c]||[]).forEach(f=>f())};
const sn=(id,v)=>({id,exists:v!==undefined,data:()=>v,metadata:{}});
const db={collection(c){return{doc(id){return{id,path:c+'/'+id,
 async get(){return sn(id,ld(c)[id])},
 async set(d){const o=ld(c);o[id]=JSON.parse(JSON.stringify(d));sv(c,o)},
 async update(d){const o=ld(c);o[id]={...(o[id]||{}),...d};sv(c,o)},
 async delete(){const o=ld(c);delete o[id];sv(c,o)},
 onSnapshot(fn){const f=()=>fn(sn(id,ld(c)[id]));(subs[c]=subs[c]||[]).push(f);setTimeout(f,0);return()=>{}}}},
 onSnapshot(fn){const f=()=>fn({docs:Object.entries(ld(c)).map(([i,v])=>sn(i,v))});(subs[c]=subs[c]||[]).push(f);setTimeout(f,0);return()=>{}}}}};
const user={me:async()=>({id:'local',name:'Продавец',isOwner:true})};
const downloads={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));a.download=filename;document.body.appendChild(a);a.click();a.remove()}};
window.claude={use:async n=>({db,user,downloads})[n]||null};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
let db,me,smp,R=[],A=[],P=[],D=[],O=[],J=[],S={rate:3.5,cur:'₸',day:7000},now=new Date(),mo=iso(now).slice(0,7),tab='c',edit=null,src='manual',filt='all',admin=false,last=0;
const fmt=n=>(Math.round(n*100)/100).toLocaleString('ru-RU',{maximumFractionDigits:2});
const money=n=>fmt(n)+'\u00a0'+S.cur;
const tm=t=>new Date(t).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function vib(){try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}

async function init(){
  try{const u=await claude.use('user');me=u?await u.me():null;db=await claude.use('db');smp=await claude.use('sample')}catch(e){}
  if(!db||!me){$('#app').innerHTML='<div class="empty">Войдите в аккаунт Claude, чтобы открыть приложение.</div>';return}
  admin=!!me.isOwner;if(admin)loadPin();
  db.collection('receipts').onSnapshot(s=>{R=s.docs.map(d=>({id:d.id,...d.data()}));render()});
  db.collection('orders').onSnapshot(s=>{O=s.docs.map(d=>({id:d.id,...d.data()}));render()});
  db.collection('adj').onSnapshot(s=>{J=s.docs.map(d=>({id:d.id,...d.data()}));render()});
  db.collection('days').onSnapshot(s=>{D=s.docs.map(d=>({id:d.id,...d.data()}));render()});
  db.collection('audit').onSnapshot(s=>{A=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.t-a.t);if(tab==='a')render()});
  db.collection('presence').onSnapshot(s=>{P=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==='a')render()});
  db.collection('settings').doc('main').onSnapshot(d=>{if(d.exists){S={...S,...d.data()};render()}});
  if(!admin)log('Вход','Открыла приложение');
  beat();setInterval(beat,30000);document.addEventListener('visibilitychange',beat);
  render();
}
function beat(){if(!db||!me||document.hidden)return;db.collection('presence').doc(me.id).set({name:me.name||'Пользователь',t:Date.now(),v:tab==='a'?'Админка':'Чеки',own:admin}).catch(()=>{})}
function log(a,d){if(!db)return;const t=Date.now();db.collection('audit').doc(t+'-'+Math.random().toString(36).slice(2,6)).set({t,a,d,who:me.name||'Пользователь',own:admin}).catch(()=>{})}

function render(){
  if(!db)return;
  if(tab==='a'&&!unlocked&&document.activeElement&&document.activeElement.id==='pin')return;
  const [y,m]=mo.split('-').map(Number);const dim=new Date(y,m,0).getDate();
  const rs=R.filter(r=>r.date&&r.date.startsWith(mo)).sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
  const sales=rs.reduce((s,r)=>s+r.amount,0),earn=rs.reduce((s,r)=>s+r.e,0);
  const wd=D.filter(x=>x.w&&x.id.startsWith(mo)),dn=iso(now),wdd=wd,base=wdd.reduce((s,x)=>s+x.p,0),adj=J.filter(x=>x.date&&x.date.startsWith(mo)),adjS=adj.reduce((s,x)=>s+x.a,0);
  const byDay=Array(dim).fill(0);rs.forEach(r=>byDay[+r.date.slice(8)-1]+=Math.max(r.amount,0));
  const mx=Math.max(...byDay,1),td=iso(now).startsWith(mo)?now.getDate():-1;
  const avg=rs.length?sales/rs.length:0;
  let h='';
  if(tab==='c'){
    h+=`<div class="top"><h1>${admin?'Чеки':'Привет'} 🌷</h1><div class="mn"><button data-m="-1">‹</button><span>${MN[m-1]} ${y}</span><button data-m="1">›</button></div></div>
    <div class="hero"><small>Зарплата за месяц</small><div class="big" id="big" data-v="${window._v||0}">${money(window._v||0)}</div>${S.goal?`<div class="pg"><i style="width:${Math.max(0,Math.min(100,(earn+base+adjS)/S.goal*100))}%"></i></div>`:''}
    <div class="stats"><div><b>${money(base)}</b>оклад · ${wdd.length} дн.</div><div><b>${money(earn)}</b>${fmt(S.rate)}% с продаж</div><div><b>${rs.length}</b>чеков</div></div>
    <div class="chart">${byDay.map((v,i)=>`<i class="${i+1===td?'t':''}" style="height:${Math.max(v/mx*100,6)}%;animation-delay:${i*12}ms"></i>`).join('')}</div></div>`;
    h+=cal(y,m,wd,byDay)+adjHtml(adj,adjS);if(!rs.length)h+='<div class="empty">В этом месяце чеков пока нет.<br>Нажмите «+» и сфотографируйте первый 🌸</div>';
    let cd='',i=0;
    for(const r of rs){
      if(r.date!==cd){cd=r.date;const ds=rs.filter(x=>x.date===cd);const d=new Date(cd+'T12:00');
        h+=`<div class="sec"><span>${d.toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long'})}${cd===iso(now)?' · сегодня':''}</span><span>+${money(ds.reduce((s,x)=>s+x.e,0))}</span></div>`}
      h+=`<div class="row" data-id="${r.id}" style="animation-delay:${Math.min(i++,12)*30}ms"><div class="dot">${r.amount<0?'↩️':r.src==='photo'?'🧾':'✍️'}</div><div class="l"><div class="a">${money(r.amount)}</div><div class="n">${esc(r.note)||'без заметки'} · ${tm(r.ts).split(', ').pop()}</div></div><div class="e ${r.e<0?'neg':''}">${r.e>0?'+':''}${money(r.e)}</div></div>`}
    if(!admin)h+='<div class="note">🔍 Журнал действий виден вам обоим: он защищает от споров «кто и что вносил».</div>';
    window._t=earn+base+adjS;
  }else if(tab==='o'){h+=viewO()}else if(tab==='s'){h+=viewS()}else if(!unlocked){
    h+=`<div class="top"><h1>Админка 🛡️</h1></div><div class="card" style="text-align:center"><div style="font-size:40px">🔐</div><p>${!pinLoaded?'Загрузка…':pinH===null?'Придумайте пароль для входа в админку (от 6 символов)':'Введите пароль'}</p><input type="password" id="pin" maxlength="40" autocomplete="off" style="width:100%;text-align:center;font-size:22px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:12px"><div class="st" id="pe"></div><div class="btns"><button class="pri" id="pk">${pinH===null?'Создать пароль':'Войти'}</button></div></div>`;
  }else{
    const nowt=Date.now();
    h+=`<div class="top"><h1>Админка 🛡️</h1><div class="mn"><button data-m="-1">‹</button><span>${MN[m-1]} ${y}</span><button data-m="1">›</button></div></div>`;
    for(const p of P.filter(p=>!p.own)){const on=nowt-p.t<75000;
      h+=`<div class="card"><span class="on-dot ${on?'y':''}"></span><b>${esc(p.name)}</b> — ${on?'онлайн · '+esc(p.v):'не в сети, была '+tm(p.t)}</div>`}
    if(!P.filter(p=>!p.own).length)h+='';
